[package]
name = "ebpf-agentic-firewall"
version = "0.1.0"
edition = "2021"
description = "eBPF-driven zero-trust quarantine controller (XDP/TC probes + Rust AI triage daemon)"
license = "MIT"

[[bin]]
name = "zqfw"
path = "src/main.rs"

[dependencies]
aya = "0.14"
aya-log = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.9"
thiserror = "2"
anyhow = "1"
libc = "0.2"
humantime = "2"

[features]
default = []
# Enable the optional external LLM triage backend (HTTP, OpenAI-compatible).
llm = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["rustls-tls", "json"]

[dev-dependencies]
aya-obj = "0.3"

[profile.release]
lto = true
strip = true

[profile.dev]
debug = 1
